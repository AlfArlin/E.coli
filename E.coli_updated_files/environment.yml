# Exact versions the pipeline was run and verified with (Windows 11 and Linux).
# Create with:  conda env create -f environment.yml   then:  conda activate proteome-allocation
# Run with:     python run_all.py
name: proteome-allocation
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - numpy==2.5.3
      - pandas==3.0.5
      - scipy==1.18.1
      - scikit-learn==1.9.1
      - matplotlib==3.11.2
      - openpyxl==3.1.5
      - PyYAML==6.0.3
      - joblib==1.6.0
      - requests==2.34.2
      - jupyterlab
      - nbconvert
      - ipykernel
      # optional, only for the h5ad export in notebook 01:
      # - anndata
